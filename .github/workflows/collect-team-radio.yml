name: Collect published team radio captions

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      meeting:
        description: "그랑프리 이름으로 수집 범위 제한 (비우면 최근 세션)"
        required: false
        type: string
      dry_run:
        description: "자막 생성과 저장 없이 대상만 확인"
        required: false
        default: false
        type: boolean
      max_clips:
        description: "이번 실행에서 새로 처리할 최대 자막 수"
        required: false
        default: 30
        type: number
      backfill_speakers:
        description: "기존 영어 자막의 화자 구간 다시 분석"
        required: false
        default: false
        type: boolean

concurrency:
  group: collect-team-radio
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_SUMMARY_MODEL: "gpt-6-luna"
      TEAM_RADIO_AUDIO_PROXY_URL: "https://paddock-brief-five.vercel.app/api/team-radio-audio"
      APP_USE_SAMPLE_DATA: "false"
      MEETING_FILTER: ${{ inputs.meeting }}
      DRY_RUN: ${{ inputs.dry_run }}
      MAX_CLIPS: ${{ inputs.max_clips }}
      BACKFILL_SPEAKERS: ${{ inputs.backfill_speakers }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Transcribe and save published clips
        run: |
          args=(--meeting "$MEETING_FILTER" --max-clips "${MAX_CLIPS:-30}")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$BACKFILL_SPEAKERS" = "true" ]; then args+=(--backfill-speakers); fi
          uv run python scripts/collect_team_radio.py "${args[@]}"
