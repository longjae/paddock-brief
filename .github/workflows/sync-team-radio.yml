name: Sync team radio transcripts

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      event_slug:
        description: "경기 slug. 비우면 현재 경기"
        required: false
        type: string

concurrency:
  group: sync-team-radio
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_SUMMARY_MODEL: "gpt-6-luna"
      EVENT_SLUG: ${{ inputs.event_slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Save radio transcripts
        run: uv run python scripts/sync_team_radio.py --event-slug "$EVENT_SLUG"
