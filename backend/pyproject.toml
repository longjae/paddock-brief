[project]
name = "paddock-brief-api"
version = "0.1.0"
description = "FastAPI backend for Paddock Brief"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]==0.141.1",
  "httpx==0.28.1",
  "pydantic-settings==2.11.0",
  "supabase==2.31.0",
  "websockets==15.0.1",
]

[tool.vercel]
entrypoint = "app.main:app"

[dependency-groups]
collector = [
  "fastf1==3.8.3",
  "youtube-transcript-api==1.2.3",
  "yt-dlp==2026.8.19",
]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
